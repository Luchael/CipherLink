name: Release CipherLink

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.11.8'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cipherlink-public-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CIPHERLINK_BUILD_NONINTERACTIVE: '1'
      REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source version
        shell: pwsh
        run: |
          python tools/release_metadata.py $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        working-directory: pc
        shell: pwsh
        run: |
          & cmd /d /c build_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify installer lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish,previous -Force | Out-Null
          Copy-Item pc/dist/CipherLink.exe publish/CipherLink-Windows.exe
          ./tools/build_windows_installer.ps1 -Version $env:RELEASE_VERSION -InputExecutable publish/CipherLink-Windows.exe -OutputDirectory publish
          gh release download v0.11.5 --pattern CipherLink-Windows.exe --dir previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build_windows_installer.ps1 -Version 0.11.5 -InputExecutable previous/CipherLink-Windows.exe -OutputDirectory previous/setup
          ./tools/test_windows_installer.ps1 -PreviousInstaller previous/setup/CipherLink-Windows-Setup.exe -CurrentInstaller publish/CipherLink-Windows-Setup.exe -CurrentVersion $env:RELEASE_VERSION
          python tools/release_metadata.py $env:RELEASE_VERSION --directory publish --windows-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create or resume release draft
        shell: pwsh
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "사이퍼링크 $env:RELEASE_VERSION" --notes-file "docs/releases/v$env:RELEASE_VERSION.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($draft -ne 'true') { throw 'Release already published; existing files will not be overwritten' }
      - name: Attach verified Windows files
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG publish/CipherLink-Windows.exe publish/CipherLink-Windows-Setup.exe publish/CipherLink-Windows-Setup.exe.sha256 publish/SHA256SUMS.txt publish/update.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update main README download links
        shell: pwsh
        run: |
          python tools/update_download_links.py $env:RELEASE_VERSION --github --android-unavailable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
