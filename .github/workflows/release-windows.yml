name: Release CipherLink

on:
  push:
    branches: [main]
    paths:
      - 'pc/gametodo/__init__.py'
      - 'android/app/build.gradle.kts'
      - '.github/release-request.json'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must match the selected source'
        required: false
        type: string

permissions:
  contents: write

# Serialize main/tag events; completed versions are skipped by the plan job.
concurrency:
  group: cipherlink-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source and skip completed releases
        id: plan
        run: python tools/prepare_release.py

  windows:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CIPHERLINK_BUILD_NONINTERACTIVE: '1'
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows application
        working-directory: pc
        shell: pwsh
        run: |
          & cmd /d /c build_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify installer lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish,previous -Force | Out-Null
          Copy-Item pc/dist/CipherLink.exe publish/CipherLink-Windows.exe
          ./tools/build_windows_installer.ps1 -Version $env:RELEASE_VERSION -InputExecutable publish/CipherLink-Windows.exe -OutputDirectory publish
          gh release download v0.11.5 --pattern CipherLink-Windows.exe --dir previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build_windows_installer.ps1 -Version 0.11.5 -InputExecutable previous/CipherLink-Windows.exe -OutputDirectory previous/setup
          ./tools/test_windows_installer.ps1 -PreviousInstaller previous/setup/CipherLink-Windows-Setup.exe -CurrentInstaller publish/CipherLink-Windows-Setup.exe -CurrentVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            publish/CipherLink-Windows.exe
            publish/CipherLink-Windows-Setup.exe
            publish/CipherLink-Windows-Setup.exe.sha256
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android release
        run: gradle --no-daemon --max-workers=2 --console=plain -p android :app:assembleRelease
      - name: Sign and verify APK with the fixed release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python tools/android_release.py --unsigned android/app/build/outputs/apk/release/app-release-unsigned.apk --output publish/CipherLink-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: publish/CipherLink-Android.apk
          if-no-files-found: error

  publish:
    needs: [plan, windows, android]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: publish
      - name: Validate versions and generate checksums
        run: python tools/release_metadata.py "$RELEASE_VERSION" --directory publish
      - name: Publish both platforms together
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'An existing published release will not be overwritten.'
              exit 1
            fi
          else
            if [ -f "docs/releases/$tag.md" ]; then
              gh release create "$tag" --verify-tag --draft --title "사이퍼링크 $RELEASE_VERSION" --notes-file "docs/releases/$tag.md"
            else
              gh release create "$tag" --verify-tag --draft --title "사이퍼링크 $RELEASE_VERSION" --generate-notes
            fi
          fi
          gh release upload "$tag" publish/CipherLink-Windows.exe publish/CipherLink-Windows-Setup.exe publish/CipherLink-Windows-Setup.exe.sha256 publish/CipherLink-Android.apk publish/SHA256SUMS.txt publish/update.json --clobber
          gh release edit "$tag" --draft=false --latest
  downloads:
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.publish == 'false' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README downloads on main
        run: python tools/update_download_links.py "$RELEASE_VERSION" --github
